<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Caixa-Preta ✈️</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; text-align: center; padding-top: 50px; }
        .painel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; }
        h2 { color: #2c3e50; }
        #painelCombustivel { font-size: 1.2rem; font-weight: bold; color: #34495e; margin: 20px 0; }
        button { padding: 12px 20px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; margin: 5px; transition: 0.3s; }
        #btnGastar { background-color: #e74c3c; color: white; }
        #btnAbastecerSeguro { background-color: #27ae60; color: white; }
        button:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="painel">
        <h2>✈️ Controle de Voo VIP-001</h2>
        <p id="painelCombustivel">Status: Carregando sistemas...</p>
        
        <button id="btnGastar">Gastar Combustível (Voar)</button>
        <button id="btnAbastecerSeguro">Abastecer 10%</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
