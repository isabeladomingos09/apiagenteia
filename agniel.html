<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aeroporto Inteligente - Operação Caixa-Preta</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .painel { border: 2px solid #333; padding: 15px; border-radius: 8px; width: 300px; }
        button { margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="painel">
        <h2>Voo VIP-001</h2>
        <p id="painelCombustivel">Status: Aguardando...</p>
        
        <button id="btnGastar">Gastar Combustível (Voar)</button>
        <button id="btnAbastecerSeguro">Abastecer 10%</button>
    </div>

    <script>
        // --- CLASSE COM ENCAPSULAMENTO ---
        class VooSeguro {
            #codigo;
            #combustivel;

            constructor(codigoPassado) {
                this.#codigo = codigoPassado;
                this.#combustivel = 100;
            }

            // GETTER: Lê o valor de forma segura
            get statusCombustivel() {
                return `O tanque do voo ${this.#codigo} está em ${this.#combustivel}%`;
            }

            // SETTER: Altera o valor com regras de segurança
            set abastecer(quantidade) {
                if (quantidade < 0) {
                    console.error("Tentativa hacker: Quantidade negativa!");
                    alert("Erro: Não é possível roubar combustível!");
                } else if (this.#combustivel + quantidade > 100) {
                    console.warn("Limite atingido!");
                    this.#combustivel = 100; // Trava no máximo
                } else {
                    this.#combustivel += quantidade;
                }
            }

            // MÉTODO PARA GASTAR: (Desafio da Fase 3)
            gastar(quantidade) {
                if (this.#combustivel - quantidade < 0) {
                    this.#combustivel = 0;
                    alert("Atenção: Combustível esgotado!");
                } else {
                    this.#combustivel -= quantidade;
                }
            }
        }

        // --- LÓGICA DE INTERAÇÃO (DOM) ---

        // 1. Instanciando o voo
        const meuVoo = new VooSeguro("VIP-001");
        
        // 2. Capturando elementos da tela
        const display = document.getElementById("painelCombustivel");
        const btnGastar = document.getElementById("btnGastar");
        const btnAbastecer = document.getElementById("btnAbastecerSeguro");

        // Função para atualizar a tela
        function atualizarPainel() {
            display.innerText = meuVoo.statusCombustivel;
        }

        // Inicializar tela
        atualizarPainel();

        // 3. Eventos dos Botões
        btnGastar.addEventListener("click", () => {
            meuVoo.gastar(15); // Gastando 15%
            atualizarPainel();
        });

        btnAbastecer.addEventListener("click", () => {
            meuVoo.abastecer = 10; // Usando o SETTER
            atualizarPainel();
        });

        // TESTE HACKER NO CONSOLE:
        // Se você digitar: meuVoo.#combustivel = 0 no console do F12, 
        // o navegador vai dar um erro de sintaxe e não vai deixar mudar!
    </script>
</body>
</html>
